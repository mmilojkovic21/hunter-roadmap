# Dodatak za razvoj: izlaže bazu na localhost:5433 (dotnet watch, DBeaver, psql).
# 5433, ne 5432: na 5432 često već radi lokalno instaliran PostgreSQL.
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up db
# Vezano za 127.0.0.1, pa baza nije dostupna sa mreže.

services:
  db:
    ports:
      - "127.0.0.1:5433:5432"
