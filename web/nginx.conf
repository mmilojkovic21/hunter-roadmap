server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 25m;   # upload paketa (API prihvata do 20 MB)

    # API ide na .NET kontejner; browser vidi sve na istoj adresi, pa nema CORS-a.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: svaka nepoznata putanja vraća index.html, pa React Router preuzima (vodič, pogl. 26).
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
